name: dockerwatch

services:
  app:
    build: .
    container_name: dockerwatch-app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-5}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_AUTO_ALERT: ${DISCORD_AUTO_ALERT:-false}
      SERVER_ENV: ${SERVER_ENV:-LOCAL-DEV}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dw_net]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine3.20
    container_name: dockerwatch-db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [dw_net]
    mem_limit: 256m
    restart: unless-stopped

  cache:
    image: redis:7.4.0-alpine
    container_name: dockerwatch-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [dw_net]
    mem_limit: 128m
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [dw_net]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:

networks:
  dw_net:
    driver: bridge
